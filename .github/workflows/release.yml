name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DATABASE_URL: postgres://djwebmail:djwebmail@localhost:5432/djwebmail
  SECRET_KEY: ci-insecure-secret-key
  DEBUG: "False"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: djwebmail
          POSTGRES_PASSWORD: djwebmail
          POSTGRES_DB: djwebmail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U djwebmail"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: Lint
        run: |
          if git ls-files '*.py' | grep -q .; then
            uv run ruff check .
            uv run ruff format --check .
            uv run pyright
          else
            echo "::notice::No Python files yet; skipping lint"
          fi
      - name: Tests
        run: |
          if git ls-files '*test_*.py' | grep -q .; then
            uv run pytest
          else
            echo "::notice::No tests yet; skipping pytest"
          fi
      - name: Django checks
        run: |
          if [ -f manage.py ]; then
            uv run python manage.py check
            uv run python manage.py makemigrations --check --dry-run
          else
            echo "::notice::manage.py not found; skipping Django checks"
          fi

  image:
    name: image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: release
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if printf '%s' "$TAG" | grep -q '-'; then
            gh release create "$TAG" --generate-notes --prerelease --title "$TAG"
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
