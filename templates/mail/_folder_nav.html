{% load i18n %}
<nav
  id="folder-tree"
  class="mail-folder-panel w-full lg:w-60 xl:w-68 shrink-0 bg-base-100 p-3 flex flex-col h-full overflow-y-auto border-r border-base-300 lg:border-r-0"
  aria-label="{% translate 'Folders' %}"
  {% if oob %}hx-swap-oob="outerHTML"{% endif %}
>
  <div class="mb-3 flex items-center justify-between gap-2 lg:hidden">
    <h2 class="text-sm font-semibold tracking-wide">{% translate "Folders" %}</h2>
    <button type="button" class="btn btn-ghost btn-sm" @click="closeFolders()">
      {% translate "Close" %}
    </button>
  </div>

  <div class="mb-3">
    <a
      class="btn btn-primary w-full gap-2 shadow-xs font-semibold"
      href="{% url 'compose:new' %}"
      data-shortcut="compose"
    >
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
      <span>{% translate "Compose" %}</span>
    </a>
  </div>

  <div class="flex-1 overflow-y-auto">
    <div class="flex items-center justify-between px-2 pb-1.5 pt-1">
      <span class="text-xs font-semibold uppercase tracking-wider text-base-content/50">
        {% translate "Folders" %}
      </span>
      <button
        type="button"
        class="btn btn-ghost btn-xs btn-square text-base-content/60 hover:text-primary"
        data-dialog-open="create-folder-dialog"
        aria-haspopup="dialog"
        aria-label="{% translate 'New folder' %}"
        title="{% translate 'New folder' %}"
      >
        <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
    {% include "mail/_folder_tree.html" %}
  </div>
</nav>
