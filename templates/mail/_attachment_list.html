{% load i18n %}
{% if message.attachments %}
  <section class="border-b border-base-200 pb-3" aria-label="{% translate 'Attachments' %}">
    <h2 class="sr-only">{% translate "Attachments" %}</h2>
    <ul class="flex flex-wrap gap-2">
      {% for attachment in message.attachments %}
        <li class="flex items-center gap-2.5 rounded-lg border border-base-300 bg-base-200/50 px-3 py-2 text-xs max-w-sm">
          <div class="flex size-8 shrink-0 items-center justify-center rounded-md bg-primary/15 text-primary font-bold uppercase">
            <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
          </div>
          <div class="min-w-0 flex-1">
            <div class="truncate font-medium text-base-content" title="{{ attachment.filename }}">
              {{ attachment.filename }}
            </div>
            <div class="text-[11px] text-base-content/60">
              {{ attachment.size|filesizeformat }}
            </div>
          </div>
          <a
            class="btn btn-ghost btn-xs text-primary hover:bg-primary/10 shrink-0 gap-1"
            href="{% url 'mail:attachment' folder_name message.uid attachment.part %}"
            download
            title="{% translate 'Download' %} {{ attachment.filename }}"
          >
            <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" x2="12" y1="15" y2="3"></line>
            </svg>
            <span>{% translate "Download" %}</span>
          </a>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endif %}
