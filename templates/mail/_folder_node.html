{% load i18n %}
<li>
  {% if node.selectable and node.name %}
    <a
      class="flex items-center rounded-md px-2 py-1 text-sm transition-colors{% if node.name == current_folder %} bg-primary font-semibold text-primary-content{% else %} hover:bg-base-200{% endif %}"
      href="{% url 'mail:folder' node.name %}"
      hx-get="{% url 'mail:folder' node.name %}"
      hx-target="#message-list"
      hx-swap="innerHTML"
      hx-push-url="true"
      hx-indicator="#list-spinner"
      {% if node.name == current_folder %}aria-current="page"{% endif %}
    >{{ node.label }}</a>
  {% else %}
    <span class="block px-2 py-1 text-sm font-medium text-base-content/60">{{ node.label }}</span>
  {% endif %}

  {% if node.children %}
    <ul class="ml-2 border-l border-base-300 pl-2">
      {% for child in node.children %}
        {% include "mail/_folder_node.html" with node=child current_folder=current_folder %}
      {% endfor %}
    </ul>
  {% endif %}
</li>
